[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oneaxe-voice"
version = "0.1.0"
description = "Local GPU dictation API using Qwen3-ASR"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<0.129",
  "uvicorn>=0.30",
  "httpx>=0.28,<0.29",
  "python-multipart>=0.0.22",
  "qwen-asr==0.0.6",
  "webrtcvad-wheels==2.0.14",
  "websockets>=15,<17",
]

[project.scripts]
oneaxe-voice = "oneaxe_voice.cli:main"

[tool.setuptools.packages.find]
include = ["oneaxe_voice*"]
