[package]
name = "oneaxe-voice-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "OneAxe Voice Linux remote dictation client"
license = "MIT"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "5"
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }
gtk = "0.18"
glib = "0.18"
gio = "0.18"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
webrtc-vad = "0.4"
libc = "0.2"
libloading = "0.8"

[patch.crates-io]
# The registry package bundles libfvad already. Its build.rs must not run
# `git submodule` in an ancestor repository during a reproducible build.
webrtc-vad = { path = "vendor/webrtc-vad" }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
debug = 0
